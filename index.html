<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Studio Tasy</title>
<style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        .hero {
            height: 100vh;
            /* 아래 url 괄호 안에 원하는 이미지 주소나 깃허브에 올린 이미지 파일명을 넣으세요 */
            background-image: url(https://tasy.net/image/bg.jpg); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            background-color: rgba(0,0,0,0.6);
            background-blend-mode: overlay;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .btn-container {
            display: flex;
            gap: 15px;
        }
        .btn {
            padding: 15px 30px;
            background-color: #0070f3;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #005bb5;
        }
        .btn-outline {
            background-color: transparent;
            border: 2px solid white;
        }
        .btn-outline:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
<div class="hero">
<h1>Studio Tasy</h1>
<p>자료 공유 및 소통 공간입니다.</p>
<div class="btn-container"><a class="btn" href="https://tasy.net/엄마가될자격.pdf" target="_blank">엄마가될자격</a><a class="btn btn-outline" href="https://tally.so/r/b5DN4g" target="_blank">방명록 남기기</a></div>
</div>
</body>
</html>
