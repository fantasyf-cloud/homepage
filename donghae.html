function positionSpeech(){const u=unit();$('speech').style.left=clamp(pos.x-35,8,W-135)+'px';$('speech').style.top=Math.max(8,pos.y-234*u-28)+'px';}

function setMoving(on){if(moving===on)return;moving=on;cat.classList.toggle('moving',on);cat.setAttribute('aria-label',on?'모래 위를 걷는 갈색 줄무늬 장모 고양이':'바다를 바라보며 앉은 갈색 줄무늬 장모 고양이');if(!on){resetLegs();view='sit';cat.dataset.view='sit';}renderDirty=true;}

// 한 RAF 안에서 이동과 폭죽을 갱신한다. 화면이 멈추면 루프도 멈춘다.
const colors=['#f5d999','#eca384','#db9ebd','#b5d9ce','#add8ed','#cfbfe4'];
function launch(x,y){if(!night||document.hidden||!ctx)return;const now=performance.now();if(now-lastLaunch<160)return;lastLaunch=now;const cx=typeof x==='number'?clamp(x,10,W-10):W*(.18+Math.random()*.64),cy=typeof y==='number'?clamp(y,10,H*.38):H*(.12+Math.random()*.18),color=colors[Math.floor(Math.random()*colors.length)],count=reduced?22:lowPower?34:46;if(particles.length+count>MAX_PARTICLES)particles.splice(0,particles.length+count-MAX_PARTICLES);for(let i=0;i<count;i++){const angle=i/count*Math.PI*2+Math.random()*.15,speed=28+Math.random()*83;particles.push({x:cx,y:cy,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1.3+Math.random()*.8,total:2.1,color,size:.8+Math.random()*1.4});}popSound();requestTick();}
